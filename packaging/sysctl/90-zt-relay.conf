# Kernel settings of an internet-facing zt-relay host (docs/RELAY_HARDENING.md; rationale in
# docs/analysis/relay-hardening.md §2(d)). Install as /etc/sysctl.d/90-zt-relay.conf, together
# with zt-relay.modules-load.conf as /etc/modules-load.d/zt-relay.conf, then run
# systemd-sysctl (or reboot).
#
# A key with the '-' prefix may be absent on some distributions and is then ignored; every
# other key must exist (CI checks it on a full Ubuntu kernel). Do not add
# user.max_user_namespaces=0: the relay unit's PrivateUsers=yes needs a user namespace.

# --- SYN floods and the accept queue ---
# Stateless SYN handling once the SYN queue overflows (pins the distribution default).
net.ipv4.tcp_syncookies = 1
# Room before cookies take over (cookies lose some TCP options on older kernels).
net.ipv4.tcp_max_syn_backlog = 8192
# Ceiling of the relay's [network] listen_backlog (default 4096).
net.core.somaxconn = 4096
# Half-open connections live ~7 s instead of ~63 s; a spoofed SYN reflects 3 SYN-ACKs, not 6.
net.ipv4.tcp_synack_retries = 2
# No segmentation below 536 bytes (CVE-2019-11477 class); the firewall drops tiny-MSS SYNs.
net.ipv4.tcp_min_snd_mss = 536
# TIME_WAIT assassination protection.
net.ipv4.tcp_rfc1337 = 1
# Orphaned FIN_WAIT2 sockets (a peer that never closes after a refusal) go away in 15 s.
net.ipv4.tcp_fin_timeout = 15

# --- addresses and routing ---
# Strict reverse path for IPv4 (use 2 on multi-homed hosts with asymmetric routing; the
# firewall's fib rule covers IPv6).
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
# A relay never needs ICMP redirects or source routing.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# Smurf reflection and log noise.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Martian logging floods the journal during a spoofed flood; the nft counters measure it.
net.ipv4.conf.all.log_martians = 0
# Not a router (a host that also runs a container runtime needs 1: see the runbook).
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# --- kernel exploit primitives ---
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1
# 1 is sticky until reboot, as intended.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# Only root may ptrace (zt-relay is also non-dumpable).
kernel.yama.ptrace_scope = 2
# Debian and Ubuntu kernels honour 3; upstream treats it as 2.
kernel.perf_event_paranoid = 3
# Sticky until reboot. The - prefix: kernels built without kexec or SysRq (some microVM
# kernels) have nothing to disable.
-kernel.kexec_load_disabled = 1
-kernel.sysrq = 0
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0
# Debian-only key: no unprivileged user namespaces outside systemd's own sandboxing.
-kernel.unprivileged_userns_clone = 0

# --- conntrack ---
# The relay port is untracked (nftables notrack), so only SSH, ICMP and the host's own egress
# use the table. The module is loaded early by modules-load.d, otherwise this key would not
# exist yet when systemd-sysctl runs.
-net.netfilter.nf_conntrack_max = 262144

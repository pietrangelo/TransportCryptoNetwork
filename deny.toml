# cargo-deny: supply chain checks, run in CI (job `deny`).

[graph]
all-features = true
# The platforms TCN is built and tested for: the release targets (release.yml) and the CI and
# developer hosts. Listing them makes cargo-deny ignore dependencies that no real build
# compiles: libcrux-ml-kem pulls `hax-lib` (and through it the unmaintained
# `proc-macro-error2`, RUSTSEC-2026-0173) only under `cfg(hax)`, a cfg set exclusively by the
# hax verification toolchain, never by rustc for any of these targets.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# Every RustSec advisory (vulnerabilities, unmaintained crates, yanks) fails the build.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# libfuzzer-sys bundles LLVM's libFuzzer (NCSA licence). It is only needed by the fuzzing targets in
# fuzz/, which do not end up in the distributed binaries.
exceptions = [{ crate = "libfuzzer-sys", allow = ["NCSA"] }]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The internal crates use `path`: they are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

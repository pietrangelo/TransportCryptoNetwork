# cargo-deny: supply chain checks, run in CI (job `deny`).

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerabilities, unmaintained crates, yanks) fails the build.
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
# libfuzzer-sys bundles LLVM's libFuzzer (NCSA licence). It is only needed by the fuzzing targets in
# fuzz/, which do not end up in the distributed binaries.
exceptions = [{ crate = "libfuzzer-sys", allow = ["NCSA"] }]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The internal crates use `path`: they are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

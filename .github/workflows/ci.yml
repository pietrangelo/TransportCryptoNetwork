name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: no CI job writes to the repository. The jobs run dependency code
# (build scripts, proc macros) and must not have a token capable of modifying anything.
permissions:
  contents: read

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
        env:
          PROPTEST_CASES: "10000"
      - run: cargo build --release --workspace --locked
      # The fuzzing targets have their own Cargo.lock: it must be up to date (finding A8-7),
      # and the targets must build with it.
      - run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins

  aarch64:
    # The KEM vectors and the libcrux backend check on aarch64, on every PR, not only at
    # release time (finding A8-6).
    name: aarch64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo test -p zt-crypto --locked
      - run: ./.github/scripts/check-libcrux-backend.sh target/debug/build

  e2e-openssh:
    # Real ssh, scp and ansible-playbook through relay, agent and zt-client (ProxyCommand).
    name: e2e-openssh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server openssh-client
      - run: pipx install ansible-core
      - run: cargo test -p zt-client --test openssh -- --ignored

  fuzz:
    # Short fuzzing on every PR: 60 s per target. Long campaigns are launched by hand.
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [frame_decoder, noise_responder, noise_initiator, kem_inputs, transport_decrypt, config_parsers, relay_core, cert_decoder, cert_verify, cert_v2_decoder, cert_v2_verify, hybrid_ik, admission, proxy_v2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      # A stale fuzz/Cargo.lock would be silently re-resolved by `cargo fuzz` (finding A8-7).
      - run: cargo +nightly metadata --locked --format-version 1 > /dev/null
        working-directory: fuzz
      - run: cargo +nightly fuzz run "$FUZZ_TARGET" -- -max_total_time=60 -rss_limit_mb=1024
        working-directory: fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  release-signing:
    # PQ-REL: the release signing tool against its specification and attack tests, with a
    # pinned OpenSSL >= 3.5 (SLH-DSA) built from source; throwaway keys only.
    name: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./.github/scripts/build-openssl.sh "$RUNNER_TEMP/openssl"
      - run: |
          export OPENSSL="$RUNNER_TEMP/openssl/bin/openssl"
          VERBOSE=1 packaging/release/tests/spec.sh
          VERBOSE=1 packaging/release/tests/attacks.sh

  host-hardening:
    # The relay host (docs/analysis/relay-hardening.md §3.7): the unit's exposure score and
    # sandbox, the nftables ruleset through the kernel, the sysctl file, firewall attacks in
    # network namespaces, and the shipped unit at run time with a sandbox probe. The runner is
    # ephemeral: the job applies the sysctl file and loads the ruleset on it.
    name: host-hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.97.0"
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools nftables iproute2 shellcheck
      # The binary that ships (static musl), so ExecPaths= and seccomp meet the real thing.
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl -p zt-relay
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl --target-dir target --manifest-path packaging/tests/host/probe/Cargo.toml
      - run: pipx install ansible-core==2.22.0 && pipx install ansible-lint==26.11.0
      - run: shellcheck -x packaging/tests/host/*.sh deploy/ansible/tests/check.sh
      # Also tests the sysusers file; the ruleset matches on the user it creates.
      - run: sudo systemd-sysusers packaging/systemd/tcn.sysusers
      - run: sudo STRICT=1 APPLY_SYSCTL=1 VERBOSE=1 packaging/tests/host/spec.sh
      # The Ansible role: syntax, lint, renderings, drift, nft -c, zt-relay check, fail-closed
      # verification. The PROXY renderings then feed the attack tests (P-19, P-20).
      - run: sudo env "PATH=$PATH" STRICT=1 OUT="$RUNNER_TEMP/render" deploy/ansible/tests/check.sh
      - run: sudo STRICT=1 PROXY_RULESET="$RUNNER_TEMP/render/proxy/zt-relay.nft" PROXY_DIRECT_RULESET="$RUNNER_TEMP/render/proxy-allow-direct/zt-relay.nft" packaging/tests/host/attacks.sh
      - run: sudo STRICT=1 LOAD_HOST_RULESET=1 packaging/tests/host/systemd-e2e.sh

  deny:
    # Supply chain: RustSec advisories, allowed licences, sources only from crates.io.
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      # Also the dependencies of the fuzzing targets, which have their own Cargo.lock.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml

  zizmor:
    # Static analysis of the workflows: template injection, excessive permissions, persisted
    # credentials, actions not pinned to a commit. Fails the PR on any finding.
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          advanced-security: false

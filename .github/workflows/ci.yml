name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: no CI job writes to the repository. The jobs run dependency code
# (build scripts, proc macros) and must not have a token capable of modifying anything.
permissions:
  contents: read

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
        env:
          PROPTEST_CASES: "10000"
      - run: cargo build --release --workspace --locked

  e2e-openssh:
    # Real ssh, scp and ansible-playbook through relay, agent and zt-client (ProxyCommand).
    name: e2e-openssh
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-server openssh-client
      - run: pipx install ansible-core
      - run: cargo test -p zt-client --test openssh -- --ignored

  fuzz:
    # Short fuzzing on every PR: 60 s per target. Long campaigns are launched by hand.
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [frame_decoder, noise_responder, transport_decrypt, config_parsers, relay_core, cert_decoder, cert_verify]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: fuzz
      - run: cargo +nightly install cargo-fuzz --version 0.13.2 --locked
      - run: cargo +nightly fuzz run "$FUZZ_TARGET" -- -max_total_time=60 -rss_limit_mb=1024
        working-directory: fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts

  deny:
    # Supply chain: RustSec advisories, allowed licences, sources only from crates.io.
    name: deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
      # Also the dependencies of the fuzzing targets, which have their own Cargo.lock.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: fuzz/Cargo.toml

  zizmor:
    # Static analysis of the workflows: template injection, excessive permissions, persisted
    # credentials, actions not pinned to a commit. Fails the PR on any finding.
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.32.0"
          advanced-security: false

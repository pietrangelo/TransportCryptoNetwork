name: soak

# R-6 nightly soak (resilience.md §5.7, R6-E5): relay, agent and echoing sshd on localhost,
# clients opening sessions in a loop, the relay restarted and its policy reloaded on a schedule;
# file descriptors, resident memory and live tasks sampled throughout. The leak gate fails the
# run on growth. A 15-second version of the same harness runs in every CI build (`soak_short`),
# and `soak_leak` proves the gate fails on an injected leak.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soak
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  soak:
    name: soak
    runs-on: ubuntu-latest
    # The soak itself lasts TCN_SOAK_SECS (30 minutes); the rest is the release build.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
      - run: cargo test --release --locked -p zt-net --test soak -- --ignored --nocapture soak_long
        env:
          TCN_SOAK_SECS: "1800"
          TCN_SOAK_REPORT: ${{ runner.temp }}/soak.csv
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: soak-samples
          path: ${{ runner.temp }}/soak.csv
          if-no-files-found: ignore

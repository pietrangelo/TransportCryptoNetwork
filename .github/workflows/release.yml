name: release

# A vN.N.N tag produces static binaries (musl) for x86_64 and aarch64, signed with an SLSA
# provenance attestation (verifiable with `gh attestation verify`), and a draft release.
on:
  push:
    tags: ["v*"]

# Default without write permissions; each job declares its own.
permissions:
  contents: read

# Only one release per tag at a time; a run in progress is not cancelled halfway.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to a commit (the tag in the comment is only a reminder). Build and
# tests, which run dependency code (build scripts), run without permissions; the OIDC
# token for the attestation exists only in the `attest` job, which builds nothing (finding 0004-5).
#
# `attest` and `release` run in the protected `release` environment (required reviewer, v*
# tags only): signing and publishing start only after explicit approval. See
# docs/REPOSITORY_SECURITY.md.
jobs:
  verify-tag:
    # Only already-reviewed code is released: the tag's commit must be on main.
    name: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: tag commit is reachable from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on main"
            exit 1
          fi
      - name: tag name is a semantic version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid tag name: $GITHUB_REF_NAME"
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: verify-tag
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --target "$TARGET" -p zt-relay -p zt-agent -p zt-client -p zt-ca
        env:
          TARGET: ${{ matrix.target }}
      - name: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="tcn-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/"zt-{relay,agent,client,ca} "dist/$name/"
          cp -r packaging/systemd LICENSE README.md docs/OPERATIONS.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tcn-${{ matrix.target }}
          path: dist/*.tar.gz*

  attest:
    name: attest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC token for the attestation's Sigstore certificate
      attestations: write # stores the SLSA attestation in the repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -c *.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

  release:
    name: release
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # creates the draft release and uploads the archives
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && cat *.sha256 > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft
          --generate-notes dist/*.tar.gz dist/SHA256SUMS

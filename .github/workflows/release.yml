name: release

# Un tag vN.N.N produce binari statici (musl) per x86_64 e aarch64, firmati con attestazione
# di provenienza SLSA (verificabile con `gh attestation verify`), e una release in bozza.
on:
  push:
    tags: ["v*"]

# Default senza permessi di scrittura; ogni job dichiara i propri.
permissions:
  contents: read

# Una sola release per tag alla volta; una run in corso non viene annullata a metà.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Le action sono fissate a un commit (il tag fra commenti è solo un promemoria). Compilazione e
# test, che eseguono codice delle dipendenze (build script), girano senza permessi; il token
# OIDC per l'attestazione esiste solo nel job `attest`, che non compila nulla (finding 0004-5).
#
# `attest` e `release` girano nell'environment protetto `release` (revisore obbligatorio, solo
# tag v*): firma e pubblicazione partono solo dopo un'approvazione esplicita. Vedi
# docs/REPOSITORY_SECURITY.md.
jobs:
  verify-tag:
    # Si rilascia solo codice già revisionato: il commit del tag deve stare su main.
    name: verify-tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: tag commit is reachable from main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::il tag $GITHUB_REF_NAME punta a $GITHUB_SHA, che non è su main"
            exit 1
          fi
      - name: tag name is a semantic version
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::nome di tag non valido: $GITHUB_REF_NAME"
            exit 1
          fi

  build:
    name: build (${{ matrix.target }})
    needs: verify-tag
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --target "$TARGET" -p zt-relay -p zt-agent -p zt-client
        env:
          TARGET: ${{ matrix.target }}
      - name: package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="tcn-${GITHUB_REF_NAME}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/"zt-{relay,agent,client} "dist/$name/"
          cp -r packaging/systemd LICENSE README.md docs/OPERATIONS.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tcn-${{ matrix.target }}
          path: dist/*.tar.gz*

  attest:
    name: attest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # token OIDC per il certificato Sigstore dell'attestazione
      attestations: write # salva l'attestazione SLSA nel repository
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -c *.sha256
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

  release:
    name: release
    needs: attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write # crea la release in bozza e carica gli archivi
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && cat *.sha256 > SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft
          --generate-notes dist/*.tar.gz dist/SHA256SUMS

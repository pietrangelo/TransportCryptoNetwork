name: release-publish

# PQ-REL (OPERATIONS §9): publishes a draft release made by release.yml, only once SHA256SUMS
# carries both offline release signatures (SLH-DSA-SHA2-128s and Ed25519), verified here with a
# pinned OpenSSL >= 3.5 against the public keys committed at the tag
# (packaging/release/keys/). The private keys never reach CI: the maintainer signs offline and
# uploads the two .sig files to the draft, then starts this workflow by hand. No key committed,
# no signature, or any mismatch: nothing is published.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (vX.Y.Z) whose draft release to verify and publish"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: verify signatures and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same protected environment as release.yml: publishing waits for explicit approval.
    environment: release
    permissions:
      contents: write # downloads the draft's assets and publishes it
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: tag name is a semantic version
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::invalid tag name"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - name: the release is still a draft
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "::error::$TAG is not a draft release"
            exit 1
          fi
      - run: ./.github/scripts/build-openssl.sh "$RUNNER_TEMP/openssl"
      - name: download SHA256SUMS, its signatures and the archives
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'SHA256SUMS' --pattern 'SHA256SUMS.slhdsa.sig' \
            --pattern 'SHA256SUMS.ed25519.sig' --pattern '*.tar.gz'
      - name: both release signatures (OpenSSL, never a zt-* binary)
        run: |
          OPENSSL="$RUNNER_TEMP/openssl/bin/openssl" \
            packaging/release/tcn-release.sh verify packaging/release/keys dist/SHA256SUMS
      - name: every archive is listed and matches
        run: |
          cd dist
          sha256sum --check --strict SHA256SUMS
          listed=$(cut -d' ' -f3 SHA256SUMS | sort)
          present=$(ls -1 -- *.tar.gz | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::the archives of the release differ from SHA256SUMS"
            exit 1
          fi
      - name: publish
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

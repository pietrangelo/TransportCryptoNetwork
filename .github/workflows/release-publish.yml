name: release-publish

# PQ-REL (OPERATIONS §9): publishes a draft release made by release.yml, only once SHA256SUMS
# carries both offline release signatures (SLH-DSA-SHA2-128s and Ed25519), verified here with a
# pinned OpenSSL >= 3.5. The private keys never reach CI: the maintainer signs offline, uploads
# the two .sig files to the draft, then starts this workflow by hand **from the release tag**
# (Actions → release-publish → Use workflow from → Tags → vX.Y.Z). No signature, a key that is
# not pinned, or any mismatch: nothing is published.
#
# Review 0013 (A13-6):
# - the tag is the ref the run was started from (no input), it must be a release tag whose
#   commit is on main, and the `release` environment admits only v* tags;
# - the verifier (tcn-release.sh and its pinned fingerprints) comes from the default branch,
#   the public keys from the tag: keys changed at a tag alone are refused;
# - OpenSSL is built in a job with a read-only token; the write token exists only on the steps
#   that call gh;
# - just before publishing, the draft's assets are listed (only the expected files) and
#   downloaded again, and must be byte for byte the ones that were verified.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  openssl:
    name: build the verifier (OpenSSL 3.5)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: started from a release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$REF_TYPE" != tag ] || ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::start release-publish from a release tag (Use workflow from → Tags)"
            exit 1
          fi
      # The build script of the default branch, not the tag's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
      - run: ./trusted/.github/scripts/build-openssl.sh "$RUNNER_TEMP/openssl"
      - run: tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/openssl.tar.gz" openssl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openssl
          path: ${{ runner.temp }}/openssl.tar.gz
          retention-days: 1
          if-no-files-found: error

  publish:
    name: verify signatures and publish
    needs: [openssl]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The same protected environment as release.yml (v* tags only): publishing waits for
    # explicit approval.
    environment: release
    permissions:
      contents: write # downloads the draft's assets and publishes it
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: started from a release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != tag ] || ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::start release-publish from a release tag (Use workflow from → Tags)"
            exit 1
          fi
      # The tag: its public keys (packaging/release/keys/).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the tag's commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $TAG points to $GITHUB_SHA, which is not on main"
            exit 1
          fi
      # The verifier and its pins: from the default branch, never from the tag (A13-4).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openssl
          path: ${{ runner.temp }}
      - run: tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/openssl.tar.gz"
      - name: the release is still a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != true ]; then
            echo "::error::$TAG is not a draft release"
            exit 1
          fi
      - name: download SHA256SUMS, its signatures and the archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'SHA256SUMS' --pattern 'SHA256SUMS.slhdsa.sig' \
            --pattern 'SHA256SUMS.ed25519.sig' --pattern '*.tar.gz'
      - name: both release signatures, by pinned keys (OpenSSL, never a zt-* binary)
        run: |
          OPENSSL="$RUNNER_TEMP/openssl/bin/openssl" \
            trusted/packaging/release/tcn-release.sh verify --tag "$TAG" \
            packaging/release/keys dist/SHA256SUMS
      - name: every archive is listed and matches
        run: |
          cd dist
          sha256sum --check --strict SHA256SUMS
          listed=$(cut -d' ' -f3 SHA256SUMS | sort)
          present=$(ls -1 -- *.tar.gz | sort)
          if [ "$listed" != "$present" ]; then
            echo "::error::the archives of the release differ from SHA256SUMS"
            exit 1
          fi
          { echo SHA256SUMS; echo SHA256SUMS.ed25519.sig; echo SHA256SUMS.slhdsa.sig
            echo "$listed"; } | sort >"$RUNNER_TEMP/expected-assets"
      - name: the draft is still what was verified, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the expected files: an asset added to the draft would be published unchecked.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | sort >"$RUNNER_TEMP/draft-assets"
          if ! diff -u "$RUNNER_TEMP/expected-assets" "$RUNNER_TEMP/draft-assets"; then
            echo "::error::the draft's assets are not exactly SHA256SUMS, its signatures and its archives"
            exit 1
          fi
          # Byte for byte what was verified: an asset replaced since then is refused.
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/again" \
            --pattern '*'
          while IFS= read -r name; do
            cmp -- "dist/$name" "$RUNNER_TEMP/again/$name"
          done <"$RUNNER_TEMP/expected-assets"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

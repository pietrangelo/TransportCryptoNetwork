# Automatic dependency updates. Every Dependabot PR goes through the same CI as
# all the others (tests, fuzzing, cargo-deny, zizmor) and requires a human review.
#
# `cooldown` waits a few days before proposing a newly published version: a
# malicious release of a dependency is usually discovered and withdrawn within that window.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

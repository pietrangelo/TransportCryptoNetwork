# Automatic dependency updates. Every Dependabot PR goes through the same CI as
# all the others (tests, fuzzing, cargo-deny, zizmor) and requires a human review.
#
# `cooldown` waits a few days before proposing a newly published version: a
# malicious release of a dependency is usually discovered and withdrawn within that window.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/fuzz"]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    # The responder pre-filter (review 0012, A12-6) replays snow's first message-1 steps with
    # snow's own primitives, so these three crates must stay on the exact major/minor line the
    # vendored snow (vendor/snow) depends on. A bump that moves them alone puts a second copy
    # in the graph and breaks that invariant: move them together with snow, by hand.
    ignore:
      - dependency-name: blake2
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: chacha20poly1305
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: curve25519-dalek
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
      # "/" and "/fuzz" are separate workspaces with their own Cargo.lock, but fuzz/ reads the
      # versions from the root Cargo.toml. One PR per directory updates only one lock file, so
      # `--locked` fails in both. One PR per dependency across both directories keeps them in step.
      cargo-major:
        group-by: dependency-name
        update-types: [major]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
